name: Python application

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/python-app.yml'
      - 'example/testing/**'
      - 'testing/**/*.py'
      - 'testing/**/.coveragerc'
      - 'pyproject.toml'
      - 'poetry.lock'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Запуск програми та тестів
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install poetry==2.5.1
          poetry install --no-interaction
      - name: Run Python
        run: python testing/1_lab/src/lab1/game.py
      - name: Test with pytest
        run: poetry run pytest -v
      - name: Check coverage (at least 90%)
        working-directory: example/testing/03_coverage
        run: >-
          poetry run pytest --import-mode=prepend test_app.py
          --cov=app --cov-branch --cov-report=term-missing
          --cov-report=xml:coverage.xml --cov-fail-under=90
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: example/testing/03_coverage/coverage.xml
          if-no-files-found: error
          retention-days: 30
