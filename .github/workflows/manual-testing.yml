name: Manual and scheduled testing

on:
  workflow_dispatch:
    inputs:
      name:
        description: Ім’я для привітання
        type: string
        required: true
        default: Executer
  # Одноразовий запуск за розкладом підтверджено 14.11.2026:
  # https://github.com/Funyk/software-testing-kn42/actions/runs/43580808544
  # За вимогою методички повторні запуски вимкнено; ручний запуск доступний.
  # schedule:
  #   - cron: '53 2 * * 6'

permissions:
  contents: read

jobs:
  bash_demo:
    name: Запускаємо в Bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash testing/5_lab/action.sh

  python_demo:
    name: Запускаємо через Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python testing/1_lab/src/lab1/game.py
      - name: Send greeting
        if: github.event_name == 'workflow_dispatch' && inputs.name != 'Executer'
        env:
          EXECUTER_NAME: ${{ inputs.name }}
        run: printf 'Привіт, %s!\n' "$EXECUTER_NAME"
