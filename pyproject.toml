[project]
name = "software-testing-kn42"
version = "0.1.0"
description = "Роботи з тестування програм та програмних комплексів"
authors = [
    {name = "Костюк Артем"}
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "flask (>=3.1.3,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["example/testing", "testing"]
python_files = ["test_*.py", "*_test.py", "test.py"]
addopts = ["--import-mode=importlib"]
pythonpath = [
    "testing/1_lab/src",
    "testing/2_lab/src",
    "testing/3_lab/src",
    "testing/4_lab/integration/src",
]
markers = [
    "unit: юніт-тести",
    "integration: інтеграційні тести",
    "card_game: приклади тестів карткової гри",
    "game_initialization: створення карти",
    "card_attributes: атрибути карти",
    "card_combat: бойова взаємодія карт",
    "input_validation: перевірка аргументів",
    "input_handling: обробка введення",
    "comparison: порівняння аргументів",
    "uses_fixtures: використання фікстур",
    "parameterized: параметризовані тести",
]

[tool.coverage.run]
branch = true
source = ["example/testing", "testing"]

[tool.coverage.report]
omit = [
    "*/test.py",
    "*/test_*.py",
    "*/tests/*",
    "*/*_test.py",
    "*/__init__.py",
    "*/conftest.py",
]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "coverage (>=7.17.3,<8.0.0)"
]
